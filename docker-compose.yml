services:
  db:
    image: postgres:17.2
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - "db:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: comtable
      POSTGRES_PASSWORD: comtable
      POSTGRES_DATABASE: comtable

  api:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    volumes:
      - "./:/app"
    ports:
      - "3000:3000"
    command: npm run start:dev
    depends_on:
      - db

volumes:
  db: